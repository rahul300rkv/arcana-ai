    <script>
      window.addEventListener("error", function(e) {
        if (e && (e.message && e.message.includes("WebSocket") || e.filename && e.filename.includes("@vite/client"))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener("unhandledrejection", function(e) {
        if (e && e.reason && (e.reason.message && e.reason.message.includes("WebSocket") || String(e.reason).includes("@vite/client"))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      (function() {
        try {
          var k = "astrofree.theme.v1";
          var t = localStorage.getItem(k) || "dark";
          var r = t === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : t;
          if (r === "light") {
            document.documentElement.classList.add("light");
            document.documentElement.style.colorScheme = "light";
          } else {
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
